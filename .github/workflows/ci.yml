name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: communitypool

jobs:
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20']
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version-file: communitypool/.nvmrc
          cache: npm
          cache-dependency-path: communitypool/package-lock.json

      - name: Pin npm to engines.npm major
        run: npm install -g npm@10

      - name: Print toolchain
        run: |
          node --version
          npm --version

      - name: Install (deterministic, no install scripts)
        run: npm ci --ignore-scripts

      - name: Frozen V1 production artifact guard
        run: npm run contracts:check-v1-frozen

      - name: Production-only audit (high+)
        run: npm audit --audit-level=high --omit=dev

      - name: Full audit (informational)
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # CI-only build placeholders — NOT real credentials. The Next.js
          # production build prerenders pages that import the Supabase client,
          # whose constructor parses the URL and requires a non-empty anon key.
          # These values let the build complete; CI never makes live calls.
          NEXT_PUBLIC_EXPECTED_CHAIN_ID: '11155111'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJjaS1wbGFjZWhvbGRlciIsInJvbGUiOiJhbm9uIn0.ci-placeholder-not-a-real-jwt-signature'

      - name: Supply-chain guard checks
        run: npm run supply-chain:check

      - name: Generate CycloneDX SBOM (production-only)
        run: npm run sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: communitypool/sbom.json
          if-no-files-found: error
          retention-days: 90

  contracts:
    name: foundry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry (pinned)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned, not "stable": the Foundry version selects compiler defaults
          # and remapping discovery. foundry.toml pins the settings that matter,
          # but the toolchain is pinned too so artifact drift can never be
          # introduced by a silent Foundry release. Bump deliberately together
          # with docs/contracts-build.md.
          version: v1.8.1

      - name: Print toolchain
        run: |
          forge --version
          git submodule status --recursive

      - name: Solidity formatting
        run: forge fmt --check

      - name: Forge clean build (canonical)
        run: |
          forge clean
          forge build --sizes

      - name: Forge tests
        run: forge test -vvv

      - name: Regenerate candidate contract artifacts from the clean build
        run: node scripts/sync-contract-artifact.mjs

      - name: Artifact integrity gate (committed candidates must equal the clean build)
        run: |
          # Independent stale-artifact check: compare the regenerated candidate
          # files against what was committed at this SHA. Fails if
          # CommunityPool.sol, ProtocolConfig.sol, a dependency, or the canonical
          # build configuration changed without the candidates being regenerated
          # and reviewed. The frozen V1 production artifact is never regenerated
          # here; its hash is guarded separately in the node job.
          git diff --exit-code -- \
            lib/onchain/community-pool-v2-candidate-artifact.json \
            lib/onchain/protocol-config-candidate-artifact.json

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [node, contracts]
    if: always()
    steps:
      - name: Fail if any required job failed
        if: needs.node.result != 'success' || needs.contracts.result != 'success'
        run: |
          echo "node: ${{ needs.node.result }}"
          echo "contracts: ${{ needs.contracts.result }}"
          exit 1
